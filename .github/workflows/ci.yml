name: Verify Timeout

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: timeout-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run check

      - name: Test game engines and saved data
        run: npm test

      - name: Build web and portable editions
        run: npm run build

      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Exercise all three browser engines
        run: npm run test:e2e

      - name: Package builds and complete corresponding source
        run: npm run release

      - name: Preserve browser diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: timeout-browser-results-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Preserve licensed release packages
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: timeout-builds-${{ github.sha }}
          path: |
            artifacts/
          if-no-files-found: error
          retention-days: 14
